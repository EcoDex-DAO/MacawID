# Server overrides: only Wildbook is public (port 80); db and opensearch on localhost.
# Project name "compose" keeps the volumes created by the first install.
name: compose
services:
  db:
    ports: !override
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
  wildbook:
    ports: !override
      - "80:8080"
    volumes:
      # replaces the submodule's copy (same target path; relative to Wildbook/devops/development); adds Delphinapterus leucas
      - ../../../server/config/commonConfiguration.properties:/usr/local/tomcat/webapps/wildbook_data_dir/WEB-INF/classes/bundles/commonConfiguration.properties
    restart: unless-stopped
  opensearch:
    ports: !override
      - "127.0.0.1:9200:9200"
    restart: unless-stopped
  # not used on this server
  smtp:
    profiles: [unused]
  autoheal:
    profiles: [unused]
