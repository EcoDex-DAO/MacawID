<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacawID Individuals</title>
<style>
  :root {
    --primary: #00ACCE; --primary-dark: #007599; --primary-darker: #004B66;
    --primary-light: #E5F6FF; --primary-100: #CCF0FF;
    --text: #1d2b36; --muted: #5b6b77; --bg: #f5f9fb; --card: #fff; --border: #dbe7ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
      'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
  }
  header {
    background: linear-gradient(90deg, var(--primary-darker), var(--primary-dark) 60%, var(--primary));
    color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--primary-dark);
    display: grid; place-items: center; font-weight: 700;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { opacity: .8; font-size: .85rem; }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav a { color: #fff; text-decoration: none; font-size: .9rem; padding: 6px 12px; border-radius: 6px; opacity: .85; }
  nav a:hover { background: rgba(255,255,255,.12); opacity: 1; }
  nav a.active { background: #fff; color: var(--primary-darker); opacity: 1; font-weight: 600; }
  .nftcard .nftbox img { height: auto; aspect-ratio: 1; }
  .free { color: var(--muted); font-style: italic; }
  .owner { display: flex; gap: 8px; align-items: center; }
  .owner img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 48px; }
  .hero h2 { margin: 0 0 4px; color: var(--primary-darker); font-size: 1.6rem; }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--primary); background: #fff; color: var(--primary-dark);
    border-radius: 999px; padding: 6px 14px; font-size: .85rem; cursor: pointer;
  }
  .chip i { font-style: italic; }
  .chip.active { background: var(--primary); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(0,75,102,.06);
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(0,75,102,.14); transform: translateY(-2px); }
  .media { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--border); }
  .media.single { grid-template-columns: 1fr; }
  .media > div { position: relative; }
  .media .label {
    position: absolute; left: 6px; bottom: 6px; background: rgba(0,75,102,.8); color: #fff;
    font-size: .68rem; padding: 2px 6px; border-radius: 4px; letter-spacing: .3px; text-transform: uppercase;
  }
  .nftbox { background: var(--primary-light); }
  .nftbox img { width: 100%; height: 190px; object-fit: cover; display: block; }
  .nft { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 4px; font-size: .82rem; }
  .nft b { color: var(--primary-darker); }
  .nft .traits { color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .links { margin-top: auto; display: flex; gap: 14px; flex-wrap: wrap; }
  .photo { height: 190px; background: var(--primary-light); display: grid; place-items: center; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo .none { color: var(--primary-dark); font-size: .85rem; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-weight: 650; font-size: 1.05rem; color: var(--primary-darker); }
  .species { font-style: italic; color: var(--muted); font-size: .9rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .tag { background: var(--primary-light); color: var(--primary-darker); border-radius: 6px; padding: 2px 8px; font-size: .78rem; }
  .dates { font-size: .8rem; color: var(--muted); }
  .card a {
    align-self: flex-start; color: var(--primary-dark); text-decoration: none;
    font-size: .85rem; font-weight: 600;
  }
  .card a:hover { text-decoration: underline; }
  .status { color: var(--muted); padding: 30px 0; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: .78rem; padding-bottom: 24px; }
  @media (max-width: 520px) { header { flex-wrap: wrap; } nav { margin-left: 0; } header .sub { display: none; } .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .photo, .nftbox img { height: 130px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>MacawID · Individuals &amp; NFTs</h1>
  <nav>
    <a href="/" data-v="both">Both</a>
    <a href="/individuals" data-v="individuals">Individuals</a>
    <a href="/nfts" data-v="nfts">NFTs</a>
  </nav>
  <span class="sub">powered by Wildbook</span>
</header>
<main>
  <section class="hero">
    <h2 id="count">Individuals</h2>
    <p id="lede"></p>
  </section>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"><div class="status">Loading…</div></div>
</main>
<footer id="updated"></footer>
<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const day = d => d ? d.slice(0, 10) : null;
  const VIEW = location.pathname.startsWith('/nfts') ? 'nfts' : location.pathname.startsWith('/individuals') ? 'individuals' : 'both';
  const showNft = VIEW === 'both';
  document.querySelector(`nav a[data-v="${VIEW}"]`).classList.add('active');
  document.getElementById('lede').textContent = {
    both: 'Every animal identified in Wildbook so far, each linked to its own Las Guacamayas NFT.',
    individuals: 'Every animal identified in Wildbook so far.',
    nfts: 'The Las Guacamayas collection: every edition, and the individual it is linked to.',
  }[VIEW];
  let all = [], filter = null;
  const traitLine = attrs => attrs.filter(a => ['Hat','Eye','Beak','Background'].includes(a.trait_type)).map(a => esc(a.value)).join(' · ');

  function renderNfts() {
    const linked = all.filter(n => n.linked).length;
    const groups = { linked: n => n.linked, available: n => !n.linked };
    document.getElementById('chips').innerHTML =
      `<button class="chip ${filter === null ? 'active' : ''}" data-s="">All (${all.length})</button>` +
      `<button class="chip ${filter === 'linked' ? 'active' : ''}" data-s="linked">Linked (${linked})</button>` +
      `<button class="chip ${filter === 'available' ? 'active' : ''}" data-s="available">Available (${all.length - linked})</button>`;
    document.getElementById('count').textContent = `${all.length} NFTs · ${linked} linked · ${all.length - linked} available`;
    const shown = all.filter(n => filter === null || groups[filter](n));
    document.getElementById('grid').innerHTML = shown.length ? shown.map(n => `
      <div class="card nftcard">
        <div class="nftbox" style="position:relative"><a href="${esc(n.image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(n.thumb)}" alt="${esc(n.name)}"></a></div>
        <div class="body">
          <div class="name">${esc(n.name)}</div>
          <div class="traits species" style="font-style:normal">${traitLine(n.attributes)}</div>
          <div class="nft">${n.linked ? `<div class="owner">${n.linked.photo ? `<img src="${esc(n.linked.photo)}" alt="">` : ''}
            <div>Linked to <b>${esc(n.linked.name)}</b><br><i>${esc(n.linked.taxonomy || '')}</i> · ${day(n.linked.linked_at)}</div></div>`
            : '<span class="free">Available, not linked yet</span>'}</div>
          <div class="links">
            ${n.linked ? `<a href="${esc(n.linked.wildbookUrl)}" target="_blank" rel="noopener">Wildbook →</a>` : ''}
            <a href="${esc(n.metadata)}" target="_blank" rel="noopener">Metadata →</a>
          </div>
        </div>
      </div>`).join('') : '<div class="status">No NFTs here.</div>';
  }

  function render() {
    if (VIEW === 'nfts') return renderNfts();
    const species = [...new Set(all.map(i => i.taxonomy || 'Unknown'))];
    document.getElementById('chips').innerHTML =
      `<button class="chip ${filter === null ? 'active' : ''}" data-s="">All (${all.length})</button>` +
      species.map(s => `<button class="chip ${filter === s ? 'active' : ''}" data-s="${esc(s)}"><i>${esc(s)}</i> (${all.filter(i => (i.taxonomy || 'Unknown') === s).length})</button>`).join('');
    const shown = all.filter(i => filter === null || (i.taxonomy || 'Unknown') === filter);
    const linked = all.filter(i => i.nft).length;
    document.getElementById('count').textContent = `${all.length} individual${all.length === 1 ? '' : 's'} discovered` + (showNft ? ` · ${linked} NFT${linked === 1 ? '' : 's'} linked` : '');
    document.getElementById('grid').innerHTML = shown.length ? shown.map(i => `
      <div class="card">
        <div class="media ${i.nft && showNft ? '' : 'single'}">
          <div class="photo">${i.photo ? `<img loading="lazy" src="${esc(i.photo)}" alt="${esc(i.name)}">` : '<span class="none">no photo</span>'}<span class="label">Wildbook</span></div>
          ${i.nft && showNft ? `<div class="nftbox"><a href="${esc(i.nft.image)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(i.nft.thumb)}" alt="${esc(i.nft.name)}"></a><span class="label">NFT #${i.nft.edition}</span></div>` : ''}
        </div>
        <div class="body">
          <div class="name">${esc(i.name)}</div>
          <div class="species">${esc(i.taxonomy || 'Unknown species')}</div>
          <div class="meta">
            <span class="tag">${i.encounters} encounter${i.encounters === 1 ? '' : 's'}</span>
            ${i.sex && i.sex !== 'unknown' ? `<span class="tag">${esc(i.sex)}</span>` : ''}
          </div>
          ${i.first ? `<div class="dates">${day(i.first) === day(i.last) ? 'Seen ' + day(i.first) : 'Seen ' + day(i.first) + ' → ' + day(i.last)}</div>` : ''}
          ${!showNft ? '' : i.nft ? `<div class="nft"><b>${esc(i.nft.name)}</b> · linked ${day(i.nft.linked_at)}
            <div class="traits">${traitLine(i.nft.attributes)}</div></div>`
            : '<div class="nft">NFT: waiting for a free edition</div>'}
          <div class="links">
            <a href="${esc(i.wildbookUrl)}" target="_blank" rel="noopener">Wildbook →</a>
            ${i.nft && showNft ? `<a href="${esc(i.nft.metadata)}" target="_blank" rel="noopener">NFT metadata →</a>` : ''}
          </div>
        </div>
      </div>`).join('') : '<div class="status">No individuals yet.</div>';
  }

  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.s || null; render();
  });

  async function load() {
    try {
      const r = await fetch(VIEW === 'nfts' ? '/api/nfts' : '/api/individuals');
      if (!r.ok) throw new Error(r.status);
      all = await r.json();
      if (VIEW !== 'nfts' && filter && !all.some(i => (i.taxonomy || 'Unknown') === filter)) filter = null;
      render();
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      if (!all.length) document.getElementById('grid').innerHTML = '<div class="status">Could not reach Wildbook data.</div>';
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
